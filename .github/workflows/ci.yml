name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint & Tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check backend tests scripts

      - name: Run Ruff format check
        run: uv run ruff format --check backend tests scripts

      - name: Run Pytest test suite
        run: uv run python -m pytest

      - name: Verify Review Lock & PR Granularity
        run: uv run python scripts/dev_review.py --mode=audit --strict

  frontend-checks:
    name: Frontend Lint & Tests (Bun & React 19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --cwd frontend

      - name: Run Oxlint
        run: bun run --cwd frontend lint

      - name: Run Bun tests
        run: bun test
        working-directory: frontend

      - name: Build frontend production bundle
        run: bun run --cwd frontend build

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Python Dependency Audit (pip-audit)
        run: uvx pip-audit

      - name: Run Frontend Dependency Audit (bun audit)
        run: bun audit --cwd frontend

  ai-review:
    name: Automated AI Code Review
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, security-audit]
    if: github.event_name == 'pull_request'
    concurrency:
      group: gemini-ai-review
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run AI Review Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run python scripts/ai_review.py --mode=github-pr --base=origin/${{ github.base_ref }} --head=${{ github.event.pull_request.head.sha }}
