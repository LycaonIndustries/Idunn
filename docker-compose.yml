services:
  # ── Iðunn Application (FastAPI + React 19 SPA) ──────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_BACKEND=supabase
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - REDIS_URL=redis://redis:6379
      - ALLOW_ENV_WRITES=true
      - PORT=8000
    volumes:
      - ./.env:/app/.env
      - idunn-data:/app/data
    depends_on:
      redis:
        condition: service_started

  # ── Redis (Asynchronous Task Queue Broker for Arq) ──────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  idunn-data:
