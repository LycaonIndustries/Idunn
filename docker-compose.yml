services:
  # ── Iðunn Application (FastAPI + React 19 SPA) ──────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_BACKEND=${DATABASE_BACKEND:-supabase}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - PORT=8000
