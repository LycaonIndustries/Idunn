[project]
name = "idunn"
version = "0.1.0"
description = "Kitchen Inventory & Meal Planning - Indian household kitchen OS"
readme = "README.md"
license = { text = "LSAL-AI-1.0" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "motor>=3.7.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "scrape-schema-recipe>=0.2.2",
    "yt-dlp>=2026.10.26",
    "faster-whisper>=1.2.1",
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "readability-lxml>=0.9",
    "isodate>=0.7.2",
    "python-multipart>=0.0.33",
    "supabase>=2.34.0",
    "filetype>=1.2.0",
    "pyjwt[crypto]>=2.9.0",
    "slowapi>=0.1.10",
    "tenacity>=9.2.1",
    "arq>=0.28.0",
    "redis>=5.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "hypothesis>=6.170.14",
    "mongomock-motor>=0.0.36",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008", # FastAPI Depends and Query in parameter defaults
]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "G",    # flake8-logging-format
    "LOG",  # flake8-logging
    "S105", # possible hardcoded password string
    "S106", # possible hardcoded password func arg
    "S107", # possible hardcoded password default
    "S113", # requests call without timeout
    "RET505", # superfluous else after return
    "RET506", # superfluous else after raise
    "RET507", # superfluous else after continue
    "RET508", # superfluous else after break
    "A001", # variable shadowing python builtin
    "A002", # argument shadowing python builtin
    "A003", # attribute shadowing python builtin
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D417", # Missing argument descriptions in docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "D417", "E501", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
