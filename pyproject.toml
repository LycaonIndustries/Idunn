[project]
name = "idunn"
version = "0.1.0"
description = "Kitchen Inventory & Meal Planning - Indian household kitchen OS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.1",
    "scrape-schema-recipe>=0.2.2",
    "yt-dlp>=2026.3.17",
    "faster-whisper>=1.2.1",
    "anthropic>=0.100.0",
    "beautifulsoup4>=4.14.0",
    "readability-lxml>=0.8.4",
    "isodate>=0.7.2",
    "python-multipart>=0.0.33",
    "supabase>=2.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "mongomock-motor>=0.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
